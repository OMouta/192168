# Builds the installer and attaches it to a GitHub release.
#
# Push a tag to release:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag is the version. It is stamped into the client, the service binary's
# version resource, and the installer filename, so all three agree.
#
# Nothing is signed. Windows will call the publisher unknown, and SmartScreen
# will warn about a build nobody has downloaded yet.

name: Release

on:
  push:
    tags: ['v*']
  # So the build can be exercised without cutting a release.
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v
        required: true
        default: 0.0.0-test

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The default is a single commit, which leaves nothing to build release
          # notes from and no earlier tag to measure against.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          # One source of truth, rather than a version repeated here to drift.
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.version }}'
          } else {
            '${{ github.ref_name }}' -replace '^v', ''
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building $version"

      - name: Build the installer
        shell: pwsh
        run: ./scripts/package.ps1 -Version ${{ steps.version.outputs.version }}

      # Kept whether or not a release is cut, so a dispatch run is testable.
      - uses: actions/upload-artifact@v4
        with:
          name: 192168-${{ steps.version.outputs.version }}-setup
          path: build/*-setup.exe
          if-no-files-found: error

      # GitHub's own generated notes list merged pull requests, of which this
      # repository has none, so the commits are listed here instead.
      - name: Write the release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $tag = '${{ github.ref_name }}'

          # The tag before this one, or nothing if this is the first.
          $previous = git describe --tags --abbrev=0 "$tag^" 2>$null
          if ($LASTEXITCODE -ne 0) { $previous = $null }

          $range = if ($previous) { "$previous..$tag" } else { $tag }
          $commits = git log $range --no-merges --pretty=format:'- %s (%h)'
          if (-not $commits) { $commits = '- No changes.' }

          $notes = @()
          $notes += if ($previous) { "### Changes since $previous" } else { '### Changes' }
          $notes += ''
          $notes += $commits
          $notes += ''
          $notes += '---'
          $notes += ''
          $notes += 'Windows 10 20H1 (build 19041) or newer, 64-bit.'
          $notes += ''
          $notes += 'This build is not signed. Windows will say the publisher is unknown, and'
          $notes += 'SmartScreen may warn that it does not recognise the app: choose **More info**,'
          $notes += 'then **Run anyway**.'

          $notes -join "`n" | Set-Content release-notes.md -Encoding utf8
          Get-Content release-notes.md

          $global:LASTEXITCODE = 0

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*-setup.exe
          body_path: release-notes.md

  # Railway watches the release branch rather than main, so the server moves
  # when a version is cut instead of on every commit. This is what moves it.
  #
  # After the installer, so a tag that cannot be built does not reach the server
  # everybody's client talks to. Forced, because the branch follows the tag
  # wherever it is rather than the other way round.
  server:
    name: Point the release branch at this tag
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - run: git push --force origin ${{ github.sha }}:refs/heads/release
